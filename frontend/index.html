<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/src/assets/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="The fabric, finally legible. Visualise, query, and automate your Cisco ACI fabric — without writing API calls." />
    <title>Fabrik — The fabric, finally legible.</title>

    <!-- Theme initialization - MUST run before any rendering to prevent flicker -->
    <script>
      (function() {
        try {
          var mode = 'dark';
          var stored = localStorage.getItem('fabrik-theme');
          if (stored) {
            var s = JSON.parse(stored).state;
            if (s && s.mode) { mode = s.mode; }
          }
          document.documentElement.classList.add(mode);
          document.documentElement.setAttribute('data-mode', mode);
        } catch (e) {
          document.documentElement.classList.add('dark');
        }
      })();
    </script>

    <!-- DM Sans (UI) + JetBrains Mono (code/class names, easier on the eye for camelCase) + Inter from Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&family=Inter:wght@600&family=JetBrains+Mono:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
