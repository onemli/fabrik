# Fabrik frontend — nginx config inside the frontend container.
#
# Responsibilities:
#   1. Serve the Vite-built SPA (dist/) with HTML5 history fallback.
#   2. Reverse-proxy /api/, /admin/, /static/ to the backend (Daphne, :8000).
#   3. Reverse-proxy /ws/ to the backend with WebSocket upgrade headers.
#
# Production deployments usually put a second nginx (or Traefik / Caddy)
# in front of this one for TLS termination and the public hostname. This
# file handles the per-container concerns only.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # ----- Health check (used by docker healthcheck and uptime probes) ------
    location /health {
        access_log off;
        return 200 "ok";
        add_header Content-Type text/plain;
    }

    # ----- Long-cache hashed static assets (Vite emits hashed filenames) ----
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # ----- Backend REST API -------------------------------------------------
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        client_max_body_size 50m;
    }

    # ----- Django admin -----------------------------------------------------
    location /admin/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ----- Django-served static files (admin assets, DRF browsable) --------
    location /static/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # ----- WebSocket: live progress, AWX status, query streaming -----------
    location /ws/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 24h;
        proxy_send_timeout 24h;
    }

    # ----- SPA fallback — all non-file routes serve index.html -------------
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ----- Don't cache index.html (so deploys roll out instantly) -----------
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # ----- Compression ------------------------------------------------------
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        application/javascript
        application/json
        application/xml
        image/svg+xml
        text/css
        text/javascript
        text/plain
        text/xml;
}
