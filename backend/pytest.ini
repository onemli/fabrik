[pytest]
# Django settings
DJANGO_SETTINGS_MODULE = fabrik.settings
pythonpath = .
python_files = tests.py test_*.py *_tests.py
python_classes = Test*
python_functions = test_*

# Asyncio settings (fix compatibility issue)
asyncio_mode = auto

# Test discovery
testpaths = tests
norecursedirs = .git .tox venv __pycache__ node_modules migrations

# Output options
addopts =
    --verbose
    --strict-markers
    --tb=short
    --disable-warnings
    --cov=.
    --cov-report=html
    --cov-report=term-missing
    --cov-config=.coveragerc
    -p no:warnings
    --reuse-db

# Markers for test organization
markers =
    unit: Unit tests (fast, isolated)
    integration: Integration tests (slower, requires DB/external services)
    slow: Slow tests
    apic: Tests that interact with APIC (mocked)
    celery: Celery task tests
    websocket: WebSocket tests
    smoke: Quick smoke tests

# Django-specific
django_find_project = true

# Coverage
[coverage:run]
source = .
omit =
    */migrations/*
    */tests/*
    */test_*.py
    */__pycache__/*
    */venv/*
    */env/*
    manage.py
    fabrik/wsgi.py
    fabrik/asgi.py

[coverage:report]
precision = 2
show_missing = True
skip_covered = False

[coverage:html]
directory = htmlcov
