name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions: read-all

jobs:
  backend:
    name: Backend Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: fabrik_test
          POSTGRES_USER: fabrik
          POSTGRES_PASSWORD: testpassword
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      redis:
        image: redis:8-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    env:
      # Django reads individual POSTGRES_* env vars (not DATABASE_URL).
      # In CI the postgres service is reachable via localhost, not via
      # the docker-compose container name "postgres".
      POSTGRES_DB: fabrik_test
      POSTGRES_USER: fabrik
      POSTGRES_PASSWORD: testpassword
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
      DATABASE_URL: postgresql://fabrik:testpassword@localhost:5432/fabrik_test
      REDIS_URL: redis://localhost:6379/0
      CELERY_BROKER_URL: redis://localhost:6379/1
      DJANGO_SECRET_KEY: ci-test-secret-key-not-for-production-use
      ENCRYPTION_KEY: ${{ secrets.CI_ENCRYPTION_KEY }}
      DEBUG: "True"
      ALLOWED_HOSTS: "*"
      # No real Neo4j in CI — driver only parses the URI at construction;
      # actual connection is lazy. Tests in this filter mock Neo4j entirely.
      NEO4J_URI: bolt://localhost:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: ci-dummy
      DJANGO_SETTINGS_MODULE: fabrik.settings

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements*.txt

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y gcc libldap2-dev libsasl2-dev

      - name: Install dependencies
        working-directory: backend
        # Two lock files: requirements.txt is the runtime stack,
        # requirements_test.txt is just the test-only extras pinned against
        # those runtime versions. --require-hashes refuses anything not
        # pinned in either file. Two separate lock files keep Dependabot
        # bumps surgical — bumping pytest never has to touch Django.
        run: pip install --require-hashes -r requirements.txt -r requirements_test.txt

      - name: Audit dependencies for known CVEs
        working-directory: backend
        continue-on-error: true
        run: |
          pip install pip-audit
          pip-audit

      - name: Django system check
        working-directory: backend
        run: python manage.py check --deploy 2>&1 | grep -v "WARNINGS" || true

      - name: Run migrations
        working-directory: backend
        run: python manage.py migrate --run-syncdb

      - name: Run tests (unit + non-integration)
        working-directory: backend
        run: |
          pytest \
            -m "not slow and not integration and not celery and not websocket" \
            --tb=short \
            --no-cov \
            -q

  frontend:
    name: Frontend Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Audit npm dependencies for known CVEs
        working-directory: frontend
        # high-or-critical advisories should be addressed, but we don't want
        # a transient registry advisory blocking unrelated PRs — stays non-
        # fatal until pip-audit is also fatal.
        continue-on-error: true
        run: npm audit --audit-level=high

      - name: TypeScript check
        working-directory: frontend
        run: npx tsc --noEmit || true

      - name: Run tests
        working-directory: frontend
        run: npm run test -- --run

  vulnscan:
    name: OSV scan
    runs-on: ubuntu-latest
    # OSV scans every dependency manifest in the repo against the OSV.dev
    # database — broader Python/JavaScript coverage than pip-audit + npm audit
    # alone (Go, Cargo, etc. covered too if we add them later).
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: OSV-Scanner
        # Default scan-args already do a recursive scan from the repo root,
        # which is what we want — every requirements.txt and package-lock.json
        # gets matched against the OSV.dev database. Non-fatal so an
        # advisory we can't fix today (no upstream release yet) doesn't
        # block unrelated PRs; same policy as pip-audit and npm audit.
        uses: google/osv-scanner-action/osv-scanner-action@c51854704019a247608d928f370c98740469d4b5 # v2.3.5
        continue-on-error: true
