name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions: read-all

jobs:
  backend:
    name: Backend Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: fabrik_test
          POSTGRES_USER: fabrik
          POSTGRES_PASSWORD: testpassword
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      redis:
        image: redis:8-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    env:
      # Django reads individual POSTGRES_* env vars (not DATABASE_URL).
      # In CI the postgres service is reachable via localhost, not via
      # the docker-compose container name "postgres".
      POSTGRES_DB: fabrik_test
      POSTGRES_USER: fabrik
      POSTGRES_PASSWORD: testpassword
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
      DATABASE_URL: postgresql://fabrik:testpassword@localhost:5432/fabrik_test
      REDIS_URL: redis://localhost:6379/0
      CELERY_BROKER_URL: redis://localhost:6379/1
      DJANGO_SECRET_KEY: ci-test-secret-key-not-for-production-use
      ENCRYPTION_KEY: ${{ secrets.CI_ENCRYPTION_KEY }}
      DEBUG: "True"
      ALLOWED_HOSTS: "*"
      # No real Neo4j in CI — driver only parses the URI at construction;
      # actual connection is lazy. Tests in this filter mock Neo4j entirely.
      NEO4J_URI: bolt://localhost:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: ci-dummy
      DJANGO_SETTINGS_MODULE: fabrik.settings

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements*.txt

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libldap2-dev libsasl2-dev

      - name: Install dependencies
        working-directory: backend
        run: pip install -r requirements.txt -r requirements_test.txt

      - name: Audit dependencies for known CVEs
        working-directory: backend
        continue-on-error: true
        run: |
          pip install pip-audit
          pip-audit

      - name: Django system check
        working-directory: backend
        run: python manage.py check --deploy 2>&1 | grep -v "WARNINGS" || true

      - name: Run migrations
        working-directory: backend
        run: python manage.py migrate --run-syncdb

      - name: Run tests (unit + non-integration)
        working-directory: backend
        run: |
          pytest \
            -m "not slow and not integration and not celery and not websocket" \
            --tb=short \
            --no-cov \
            -q

  frontend:
    name: Frontend Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: TypeScript check
        working-directory: frontend
        run: npx tsc --noEmit || true

      - name: Run tests
        working-directory: frontend
        run: npm run test -- --run
