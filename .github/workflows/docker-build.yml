name: Docker Build & Push

on:
  push:
    branches: [main]
    tags:
      - "v*"

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

permissions: read-all

jobs:
  build-backend:
    name: Build Backend
    runs-on: ubuntu-latest
    permissions:
      # contents: write so anchore/sbom-action can attach the SBOM file
      # to the GitHub Release on tag pushes. Plain pushes don't trigger
      # the attachment step.
      contents: write
      packages: write
      # cosign keyless signing exchanges this short-lived OIDC token with
      # the public Sigstore Fulcio CA to mint the signing certificate.
      id-token: write

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Install cosign
        uses: sigstore/cosign-installer@d7543c93d881b35a8faa02e8e3605f69b7a1ce62 # v3.10.0

      - name: Login to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to Docker Hub
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: |
            ghcr.io/${{ github.repository_owner }}/fabrik-backend
            onemli/fabrik-backend
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-,format=short
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: ./backend
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan image for vulnerabilities
        # Reports CVEs in OS packages and language deps. Non-blocking for
        # now so the first run doesn't block the build; tighten later by
        # adding `exit-code: '1'` once the backlog is cleared.
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        continue-on-error: true
        with:
          image-ref: ghcr.io/${{ github.repository_owner }}/fabrik-backend@${{ steps.build.outputs.digest }}
          severity: 'HIGH,CRITICAL'
          ignore-unfixed: true
          format: 'table'

      - name: Generate SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          image: ghcr.io/${{ github.repository_owner }}/fabrik-backend@${{ steps.build.outputs.digest }}
          format: cyclonedx-json
          artifact-name: fabrik-backend-sbom.cdx.json
          output-file: ./fabrik-backend-sbom.cdx.json

      - name: Sign published images
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          TAGS: ${{ steps.meta.outputs.tags }}
          COSIGN_EXPERIMENTAL: "true"
        # Same digest for every tag the build produced; cosign signs once per
        # *registry* (one ref per image name, not per tag — tags are aliases).
        # Retries up to three times because cosign uploads occasionally fail
        # with a transient INTERNAL_ERROR/stream-reset against ghcr.io.
        run: |
          set -euo pipefail
          # De-duplicate to image names (ghcr.io/.../fabrik-backend, onemli/fabrik-backend, ...).
          mapfile -t IMAGES < <(printf '%s\n' "$TAGS" | awk -F: 'NF{print $1}' | sort -u)
          for image in "${IMAGES[@]}"; do
            ref="${image}@${DIGEST}"
            for attempt in 1 2 3; do
              if cosign sign --yes "$ref"; then
                echo "signed: $ref (attempt $attempt)"
                break
              fi
              if [ "$attempt" -eq 3 ]; then
                echo "::error::cosign sign failed for $ref after 3 attempts"
                exit 1
              fi
              sleep $((attempt * 5))
            done
          done

  build-frontend:
    name: Build Frontend
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      id-token: write

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Install cosign
        uses: sigstore/cosign-installer@d7543c93d881b35a8faa02e8e3605f69b7a1ce62 # v3.10.0

      - name: Login to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to Docker Hub
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: |
            ghcr.io/${{ github.repository_owner }}/fabrik-frontend
            onemli/fabrik-frontend
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-,format=short
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: ./frontend
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan image for vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        continue-on-error: true
        with:
          image-ref: ghcr.io/${{ github.repository_owner }}/fabrik-frontend@${{ steps.build.outputs.digest }}
          severity: 'HIGH,CRITICAL'
          ignore-unfixed: true
          format: 'table'

      - name: Generate SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          image: ghcr.io/${{ github.repository_owner }}/fabrik-frontend@${{ steps.build.outputs.digest }}
          format: cyclonedx-json
          artifact-name: fabrik-frontend-sbom.cdx.json
          output-file: ./fabrik-frontend-sbom.cdx.json

      - name: Sign published images
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          TAGS: ${{ steps.meta.outputs.tags }}
          COSIGN_EXPERIMENTAL: "true"
        run: |
          set -euo pipefail
          mapfile -t IMAGES < <(printf '%s\n' "$TAGS" | awk -F: 'NF{print $1}' | sort -u)
          for image in "${IMAGES[@]}"; do
            ref="${image}@${DIGEST}"
            for attempt in 1 2 3; do
              if cosign sign --yes "$ref"; then
                echo "signed: $ref (attempt $attempt)"
                break
              fi
              if [ "$attempt" -eq 3 ]; then
                echo "::error::cosign sign failed for $ref after 3 attempts"
                exit 1
              fi
              sleep $((attempt * 5))
            done
          done

  attach-release-assets:
    name: Attach release assets
    runs-on: ubuntu-latest
    needs: [build-backend, build-frontend]
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      # contents: write so gh release upload can attach files to the
      # GitHub Release for this tag. The release itself is created
      # manually beforehand with curated notes; this job only adds
      # the docker-compose.release.yml and .env.example files.
      contents: write

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Bake version into docker-compose.release.yml
        # Replaces `${FABRIK_VERSION:-latest}` with `${FABRIK_VERSION:-<tag>}`
        # so the compose file shipped with v1.2.3 defaults to
        # onemli/fabrik-*:1.2.3 without losing the env-var override path.
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF#refs/tags/v}"
          sed -i "s|\${FABRIK_VERSION:-latest}|\${FABRIK_VERSION:-${VERSION}}|g" docker-compose.release.yml
          echo "Pinned default FABRIK_VERSION to ${VERSION}:"
          grep "FABRIK_VERSION" docker-compose.release.yml

      - name: Upload compose and env files to release
        # Fails clearly if the release doesn't yet exist for this tag —
        # the expectation is that `gh release create v<x.y.z>` ran first.
        # `--clobber` lets re-runs replace previously-uploaded copies.
        #
        # `.env.example` is copied to `env.example` (no leading dot)
        # before upload because GitHub's release asset storage strips
        # leading dots and serves dotfiles as `default.env.example`,
        # which breaks the README's curl URL.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF#refs/tags/v}"
          cp .env.example env.example
          gh release upload "v${VERSION}" \
            docker-compose.release.yml \
            env.example \
            --clobber
          echo "Uploaded docker-compose.release.yml and env.example to release v${VERSION}"
