# Production override — use with:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#
# This overrides dev-only settings: uses production Dockerfiles,
# removes volume mounts (no hot-reload), adds nginx reverse proxy,
# and configures proper resource limits.

services:
  # --- Nginx reverse proxy (new in production) ---
  nginx:
    image: nginx:alpine
    container_name: fabrik-nginx
    mem_limit: 128m
    ports:
      - "${HTTP_PORT:-80}:80"
      # - "${HTTPS_PORT:-443}:443"  # Uncomment when SSL is ready
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      # - ./nginx/ssl:/etc/nginx/ssl:ro  # Uncomment when SSL is ready
      - ./landing:/usr/share/nginx/landing:ro
    depends_on:
      - backend
      - frontend
    networks:
      - fabrik-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost/nginx-health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"

  # --- Backend: production Dockerfile, no volume mount ---
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    image: fabrik-backend:prod
    volumes: []  # Override dev volume mount
    ports: []    # Accessed via nginx, not directly
    environment:
      - TZ=${TZ:-UTC}
      - NEO4J_URI=${NEO4J_URI:-bolt://neo4j:7687}
      - NEO4J_USER=${NEO4J_USER:-neo4j}
      - NEO4J_PASSWORD=${NEO4J_PASSWORD:?NEO4J_PASSWORD is required}
      - DATABASE_URL=${DATABASE_URL:?DATABASE_URL is required}
      - CELERY_BROKER_URL=${CELERY_BROKER_URL:?CELERY_BROKER_URL is required}
      - CELERY_RESULT_BACKEND=${CELERY_RESULT_BACKEND:?CELERY_RESULT_BACKEND is required}
      - RABBITMQ_URL=${RABBITMQ_URL:?RABBITMQ_URL is required}
      - DJANGO_SECRET_KEY=${DJANGO_SECRET_KEY:?DJANGO_SECRET_KEY is required}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY:?ENCRYPTION_KEY is required}
      - DEBUG=false
      - DEMO_MODE=${DEMO_MODE:-false}
      - ALLOWED_HOSTS=${ALLOWED_HOSTS:?ALLOWED_HOSTS is required}
      - DEFAULT_USER_TIMEZONE=${DEFAULT_USER_TIMEZONE:-UTC}
      - OLLAMA_URL=${OLLAMA_URL:-http://ollama:11434}
    command: >
      sh -c "python manage.py migrate --noinput &&
             daphne -b 0.0.0.0 -p 8000 --proxy-headers fabrik.asgi:application"

  # --- Celery worker: production image, no volume mount ---
  celery-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    image: fabrik-backend:prod
    volumes: []

  # --- Celery beat: production image, no volume mount ---
  celery-beat:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    image: fabrik-backend:prod
    volumes: []

  # --- Event consumers: production image, no volume mount ---
  event-consumer-job:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    image: fabrik-backend:prod
    volumes: []

  event-consumer-workflow:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    image: fabrik-backend:prod
    volumes: []

  event-consumer-output:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    image: fabrik-backend:prod
    volumes: []

  # --- Frontend: production build served by nginx ---
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
    image: fabrik-frontend:prod
    mem_limit: 128m  # Much less than dev (no node_modules)
    command: []       # Override entrypoint — nginx serves static
    volumes: []
    ports: []         # Accessed via nginx, not directly
    environment:
      - TZ=${TZ:-UTC}


  # --- Disable dev-only services by default ---
  mailpit:
    profiles:
      - dev-only  # Won't start unless explicitly requested

  # --- Database services: remove external port exposure ---
  postgres:
    ports: []  # Not exposed externally in production

  redis:
    ports: []

  rabbitmq:
    ports: []

  neo4j:
    ports: []
