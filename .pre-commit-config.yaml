repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        exclude: ^.github/workflows/
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=1024]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.12
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.2
    hooks:
      - id: gitleaks

  - repo: local
    hooks:
      - id: no-exception-leak
        name: no exception strings in DRF Response bodies
        description: >
          Catches the py/stack-trace-exposure regression. Views should let
          unhandled errors bubble to fabrik.exception_handler instead of
          formatting str(e) into the response.
        entry: scripts/check_no_exception_leak.py
        language: system
        types: [python]
        files: ^backend/.*views.*\.py$
